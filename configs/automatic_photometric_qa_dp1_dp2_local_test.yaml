cluster:
  type: local
  local:
    n_workers: 1
    cores: 1
    memory: 2GB
  slurm:
    n_workers: 30
    queue: cpu
    account: hpc-public
    interface: ib0
    cores: 2
    processes: 1
    memory: 32GB
    walltime: 02:00:00
    adapt:
      minimum_jobs: 30
      maximum_jobs: 30
    wait_for_workers: 30
