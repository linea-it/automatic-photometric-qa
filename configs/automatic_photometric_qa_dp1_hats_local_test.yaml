notebook:
  title: Rubin DP1 - scrambled local HATS sample
  subtitle: Basic dataset characterization
  last_verified_run: '2026-09-04'
  introduction: This notebook provides lightweight statistics and diagnostic plots
    for quick characterization of the data product.
catalogs:
- title: Rubin DP1 - scrambled local HATS sample
  omit_paths: true
  path: ../data/sample/rubin_dp1_1000_sample_scrambled_hats
  basic_statistics:
    columns:
    - objectId
    - coord_ra
    - coord_dec
    - refBand
    - refExtendedness
    - refSizeExtendedness
    - detect_isIsolated
    - detect_fromBlend
    - detect_isDeblendedModelSource
    - u_cModelFlux
    - u_cModelFluxErr
    - g_cModelFlux
    - g_cModelFluxErr
    - r_cModelFlux
    - r_cModelFluxErr
    - i_cModelFlux
    - i_cModelFluxErr
    - z_cModelFlux
    - z_cModelFluxErr
    - y_cModelFlux
    - y_cModelFluxErr
    default_first_n: 20
    max_columns: 100
  unique_count:
    column: tract
    max_unique_values: 10000
    list_values: true
  spatial_distribution:
    ra_column: coord_ra
    dec_column: coord_dec
    ra_edge_count: 180
    dec_edge_count: 90
    split_every: 8
    title_suffix: Spatial Distribution
  survey_area:
    ra_column: coord_ra
    dec_column: coord_dec
    order: 12
    split_every: 8
    split_out: 8
  magnitudes:
    bands:
    - u
    - g
    - r
    - i
    - z
    - y
    models:
    - psfFlux
    - kronFlux
    - cModelFlux
    model_labels:
      psfFlux: PSF
      kronFlux: Kron
      cModelFlux: cModel
    model_colors:
      psfFlux: tab:blue
      kronFlux: tab:orange
      cModelFlux: tab:green
    histogram:
      bins: 80
      range:
      - 15
      - 35
      split_every: 8
    statistics:
      range:
      - -2
      - 35
      peak_bin_width: 0.1
      thresholds: []
      quantiles:
      - 0.16
      - 0.5
      - 0.84
      - 0.95
      split_every: 8
    mag_offset: 31.4
  magnitude_errors:
    models:
    - psfFluxErr
    - kronFluxErr
    - cModelFluxErr
    model_labels:
      psfFluxErr: PSF
      kronFluxErr: Kron
      cModelFluxErr: cModel
    model_colors:
      psfFluxErr: tab:blue
      kronFluxErr: tab:orange
      cModelFluxErr: tab:green
    histogram:
      bins: 80
      range:
      - 0
      - 2
      split_every: 8
    statistics:
      range:
      - 0
      - 8
      peak_bin_width: 0.01
      thresholds:
      - 0.1
      - 0.2
      quantiles:
      - 0.16
      - 0.5
      - 0.84
      - 0.95
      split_every: 8
  magnitude_error_trends:
    bands:
    - u
    - g
    - r
    - i
    - z
    - y
    ncols: 2
    bins: 50
    magnitude_range:
    - 15
    - 35
    error_range:
    - 0
    - 2
    dispersion_quantiles:
    - 0.16
    - 0.84
    min_count: 1
    fill_alpha: 0.15
    split_every: 8
  plot_pixels:
    projection: MOL
  plot_coverage: {}
cluster:
  type: local
  local:
    n_workers: 1
    cores: 1
    memory: 2GB
  slurm:
    n_workers: 30
    queue: cpu
    account: hpc-public
    interface: ib0
    cores: 2
    processes: 1
    memory: 32GB
    walltime: 02:00:00
    adapt:
      minimum_jobs: 30
      maximum_jobs: 30
    wait_for_workers: 30
