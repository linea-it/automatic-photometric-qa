notebook:
  title: Rubin DP2 - HATS
  subtitle: Basic characterization of the release catalogs
  last_verified_run: auto
  introduction: This notebook provides lightweight statistics and diagnostic plots
    for quick characterization of the release catalogs.
catalogs:
- title: dia_object
  omit_paths: true
  path: <path-to-data-on-mnt>/dia_object_collection
  basic_statistics:
    columns:
    - ra
    - dec
    - nDiaSources
    - u_psfFluxMean
    - u_psfFluxMeanErr
    - u_psfFluxSigma
    - g_psfFluxMean
    - g_psfFluxMeanErr
    - g_psfFluxSigma
    - r_psfFluxMean
    - r_psfFluxMeanErr
    - r_psfFluxSigma
    - i_psfFluxMean
    - i_psfFluxMeanErr
    - i_psfFluxSigma
    - z_psfFluxMean
    - z_psfFluxMeanErr
    - z_psfFluxSigma
    - y_psfFluxMean
    - y_psfFluxMeanErr
    - y_psfFluxSigma
    max_columns: 21
  spatial_distribution:
    ra_column: ra
    dec_column: dec
    ra_edge_count: 180
    dec_edge_count: 90
    split_every: 8
    title_suffix: Spatial Distribution
    footprints:
    - path: <path-to-footprint-data>/des_round19_footprint.csv
      label: DES Round 19 footprint
      color: blue
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_dp2_footprint.csv
      label: Rubin DP2 footprint
      color: red
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_footprint.csv
      label: Rubin footprint
      color: orange
      type: curve
      ra_column: ra_center
      dec_column: dec_limit
      sort_by: ra_center
  survey_area:
    ra_column: ra
    dec_column: dec
    order: 12
    split_every: 8
    split_out: 64
  plot_pixels:
    projection: MOL
  plot_coverage: {}
- title: dia_object_forced_source
  omit_paths: true
  path: <path-to-data-on-mnt>/dia_object_forced_source_collection
  basic_statistics:
    columns:
    - coord_ra
    - coord_dec
    - psfFlux
    - psfFluxErr
    - psfDiffFlux
    - psfDiffFluxErr
    max_columns: 21
    group_by:
      column: band
      values: [u, g, r, i, z, y]
      label: Band
      split_every: 8
  unique_count:
    column: tract
    max_unique_values: 10000
  spatial_distribution:
    ra_column: coord_ra
    dec_column: coord_dec
    ra_edge_count: 180
    dec_edge_count: 90
    split_every: 8
    title_suffix: Spatial Distribution
    footprints:
    - path: <path-to-footprint-data>/des_round19_footprint.csv
      label: DES Round 19 footprint
      color: blue
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_dp2_footprint.csv
      label: Rubin DP2 footprint
      color: red
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_footprint.csv
