- title: object
  omit_paths: true
  path: <path-to-data-on-data>/object_collection
  basic_statistics:
    columns:
    - objectId
    - coord_ra
    - coord_dec
    - refBand
    - refExtendedness
    - refSizeExtendedness
    - detect_isIsolated
    - detect_fromBlend
    - detect_isDeblendedModelSource
    - u_cModelFlux
    - u_cModelFluxErr
    - g_cModelFlux
    - g_cModelFluxErr
    - r_cModelFlux
    - r_cModelFluxErr
    - i_cModelFlux
    - i_cModelFluxErr
    - z_cModelFlux
    - z_cModelFluxErr
    - y_cModelFlux
    - y_cModelFluxErr
    default_first_n: 20
    max_columns: 100
  unique_count:
    column: tract
    max_unique_values: 10000
    list_values: true
  spatial_distribution:
    ra_column: coord_ra
    dec_column: coord_dec
    ra_edge_count: 180
    dec_edge_count: 90
    split_every: 8
    title_suffix: Spatial Distribution
    footprints:
    - path: <path-to-footprint-data>/des_round19_footprint.csv
      label: DES Round 19 footprint
      color: blue
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_dp2_footprint.csv
      label: Rubin DP2 footprint
      color: red
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_footprint.csv
      label: Rubin footprint
      color: orange
      type: curve
      ra_column: ra_center
      dec_column: dec_limit
      sort_by: ra_center
  survey_area:
    ra_column: coord_ra
    dec_column: coord_dec
    order: 12
    split_every: 8
    split_out: 64
  magnitudes:
    bands:
    - u
    - g
    - r
    - i
    - z
    - y
    models:
    - psfFlux
    - kronFlux
    - cModelFlux
    - gaap1p0Flux
    model_labels:
      psfFlux: PSF
      kronFlux: Kron
      cModelFlux: cModel
      gaap1p0Flux: GAaP 1.0
    model_colors:
      psfFlux: tab:blue
      kronFlux: tab:orange
      cModelFlux: tab:green
      gaap1p0Flux: tab:red
    histogram:
      bins: 80
      range:
      - 15
      - 35
      split_every: 8
    statistics:
      range:
      - -2
      - 35
      peak_bin_width: 0.1
      quantile_method: histogram
      thresholds: []
      quantiles:
      - 0.16
      - 0.5
      - 0.84
      - 0.95
      split_every: 8
    mag_offset: 31.4
  magnitude_errors:
    models:
    - psfFluxErr
    - kronFluxErr
    - cModelFluxErr
    - gaap1p0FluxErr
    model_labels:
      psfFluxErr: PSF
      kronFluxErr: Kron
      cModelFluxErr: cModel
      gaap1p0FluxErr: GAaP 1.0
    model_colors:
      psfFluxErr: tab:blue
      kronFluxErr: tab:orange
      cModelFluxErr: tab:green
      gaap1p0FluxErr: tab:red
    histogram:
      bins: 80
      range:
      - 0
      - 2
      split_every: 8
    statistics:
      range:
      - 0
      - 8
      peak_bin_width: 0.01
      quantile_method: histogram
      thresholds:
      - 0.1
      - 0.2
      quantiles:
      - 0.16
      - 0.5
      - 0.84
      - 0.95
      split_every: 8
  magnitude_error_trends:
    bands:
    - u
    - g
    - r
    - i
    - z
    - y
    ncols: 2
    bins: 50
    magnitude_range:
    - 15
    - 35
    error_range:
    - 0
    - 2
    dispersion_quantiles:
    - 0.16
    - 0.84
    min_count: 1
    fill_alpha: 0.15
    split_every: 8
  plot_pixels:
    projection: MOL
  plot_coverage: {}
