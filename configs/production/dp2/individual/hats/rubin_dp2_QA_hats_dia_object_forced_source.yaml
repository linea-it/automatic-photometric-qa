notebook:
  title: Rubin DP2 - HATS - dia_object_forced_source
  subtitle: Basic characterization of the release catalogs
  last_verified_run: auto
  introduction: This notebook provides lightweight statistics and diagnostic plots
    for quick characterization of the release catalogs.
catalogs:
- title: dia_object_forced_source
  omit_paths: true
  path: <path-to-data-on-mnt>/dia_object_forced_source_collection
  basic_statistics:
    columns:
    - coord_ra
    - coord_dec
    - psfFlux
    - psfFluxErr
    - psfDiffFlux
    - psfDiffFluxErr
    max_columns: 21
    group_by:
      column: band
      values: [u, g, r, i, z, y]
      label: Band
      split_every: 8
  unique_count:
    column: tract
    max_unique_values: 10000
  spatial_distribution:
    ra_column: coord_ra
    dec_column: coord_dec
    ra_edge_count: 180
    dec_edge_count: 90
    split_every: 8
    partition_batch_size: 256
    title_suffix: Spatial Distribution
    footprints:
    - path: <path-to-footprint-data>/des_round19_footprint.csv
      label: DES Round 19 footprint
      color: blue
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_dp2_footprint.csv
      label: Rubin DP2 footprint
      color: red
      type: regions
      ra_column: ra_deg
      dec_column: dec_deg
      region_column: region_id
      ring_type_column: ring_type
      exterior_value: exterior
      vertex_column: vertex_id
    - path: <path-to-footprint-data>/rubin_footprint.csv
      label: Rubin footprint
      color: orange
      type: curve
      ra_column: ra_center
      dec_column: dec_limit
      sort_by: ra_center
  survey_area:
    ra_column: coord_ra
    dec_column: coord_dec
    order: 12
    split_every: 8
    split_out: 64
  plot_pixels:
    projection: MOL
  plot_coverage: {}
cluster:
  type: slurm
  local:
    n_workers: 3
    cores: 2
    memory: 2GB
  slurm:
    n_workers: 22
    queue: cpu_pipelines
    account: hpc-pipelines
    interface: ib0
    cores: 2
    processes: 1
    memory: 32GB
    walltime: 12:00:00
    adapt:
      minimum_jobs: 22
      maximum_jobs: 22
    wait_for_workers: 22
