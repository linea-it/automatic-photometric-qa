cluster:
  type: slurm
  local:
    n_workers: 3
    cores: 2
    memory: 2GB
  slurm:
    n_workers: 22
    queue: cpu_pipelines
    account: hpc-pipelines
    interface: ib0
    cores: 2
    processes: 1
    memory: 32GB
    walltime: 12:00:00
    adapt:
      minimum_jobs: 22
      maximum_jobs: 22
    wait_for_workers: 22
